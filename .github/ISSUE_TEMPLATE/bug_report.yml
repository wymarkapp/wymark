name: Bug report
description: Something in Wymark does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A short report with the version and the steps is worth more than a long one without them.

        Already reported? A 👍 reaction on that issue tells us how many people it affects.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: The markdown, if it matters
      description: The smallest document that shows the problem. Paste it as is, comment markers included.
      render: markdown
  - type: input
    id: wymark-version
    attributes:
      label: Wymark version
      description: Wymark > About Wymark shows the version and build.
      placeholder: 0.1.19
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Which view
      options:
        - Formatted
        - Source
        - Both, in a split
        - Not relevant
  - type: dropdown
    id: other-writer
    attributes:
      label: Was anything else writing the file at the time
      description: Another editor, a script, an agent, a git checkout. It matters for review and comment bugs.
      options:
        - "No"
        - Another editor
        - A script or an agent
        - git
        - Not sure

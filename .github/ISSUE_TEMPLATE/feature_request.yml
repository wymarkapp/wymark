name: Feature request
description: Something you wish Wymark did, or did differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Look for an existing request first. A 👍 reaction on it is a vote, and the votes help decide what comes next.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where Wymark gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: If you have a shape in mind. It is fine to leave this empty.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, or the other tool you reach for.
